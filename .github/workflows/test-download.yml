name: Test download asset

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build and check dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Build
        run: yarn build
      - name: Check that dist/index.js is up to date
        run: git diff --exit-code -- dist/index.js

  download:
    strategy:
      matrix:
        runs-on:
          - ubuntu-latest
          - macos-latest
          - windows-latest

        version:
          - 'tags/v0.1.18'
          - '23960137'
          - ''

    name: Download
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create a subdirectory
        run: |
          mkdir subdir
      # The action under test is the repository root itself, which has no self-repository form.
      - name: Get a specific version
        id: get_release
        uses: ./ # zizmor: ignore[self-repository]
        with:
          repo: 'dsaltares/godot-wild-jam-18'
          version: ${{ matrix.version }}
          file: 'plague-linux.zip'
          target: 'subdir'
      - name: Display the outputs
        env:
          VERSION: ${{ steps.get_release.outputs.version }}
          NAME: ${{ steps.get_release.outputs.name }}
          BODY: ${{ steps.get_release.outputs.body }}
        run: |
          echo "$VERSION"
          echo "$NAME"
          echo "$BODY"
      - name: Display the file (Linux, Mac)
        run: ls -l subdir/plague-linux.zip
        if: matrix.runs-on != 'windows-latest'
      - name: Display the file (Windows)
        run: dir subdir/plague-linux.zip
        if: matrix.runs-on == 'windows-latest'
